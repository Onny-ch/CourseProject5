[flake8]
exclude = .git,__pycache__,migrations,venv,.venv
max-line-length = 120
extend-ignore = E203, W503

[isort]
profile = black
line_length = 120
known_first_party = habits,notifications,users
src_paths = apps,config

[tool:black]
line-length = 120
target-version = ['py311']

[coverage:run]
branch = True
source = apps



