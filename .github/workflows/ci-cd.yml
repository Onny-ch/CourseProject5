name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'features/**' ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PYTHON_VERSION: '3.11'
  DOCKER_BUILDKIT: 1

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 apps config --exclude=migrations --max-line-length=120 --count --statistics

      - name: Run black check
        run: |
          black --check apps config

      - name: Setup test environment
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "True"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          python manage.py migrate

      - name: Run tests with coverage
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "True"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: habits-tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose build
        run: |
          touch .env
          docker compose config

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-docker]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/master' || 
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/heads/features/'))
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            cd "$DEPLOY_PATH"
            
            # Инициализируем Git репозиторий, если его нет
            if [ ! -d .git ]; then
              echo "Initializing Git repository"
              git init
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
            else
              # Обновляем remote URL на случай, если он изменился
              git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
            fi
            
            # Извлекаем имя ветки из github.ref
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
            
            # Получаем информацию о ветках
            git fetch origin || exit 1
            
            # Проверяем существование ветки на удаленном репозитории и деплоим её
            if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
              echo "Deploying branch: $BRANCH_NAME"
              git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME" || exit 1
            else
              # Если ветки нет на удаленном репозитории, используем main/master как fallback
              echo "Branch $BRANCH_NAME not found, using main/master as fallback"
              if git ls-remote --heads origin main | grep -q main; then
                git checkout -B main origin/main || exit 1
              elif git ls-remote --heads origin master | grep -q master; then
                git checkout -B master origin/master || exit 1
              else
                echo "Error: Neither main nor master branch found"
                exit 1
              fi
            fi
            
            # Запускаем Docker Compose
            sudo docker compose -f docker-compose.yml down
            sudo docker compose -f docker-compose.yml build --no-cache
            sudo docker compose -f docker-compose.yml up -d
            sudo docker compose -f docker-compose.yml exec -T web python manage.py migrate
            sudo docker compose -f docker-compose.yml exec -T web python manage.py collectstatic --noinput
            sudo docker compose -f docker-compose.yml restart web
